name: cloudrun
defaults:
  REGION: europe-west1
  MEMORY: 512Mi
deploy:
  - name: Build
    run: docker build -t gcr.io/$PROJECT/$NAME:$VERSION .
  - name: Push
    run: docker push gcr.io/$PROJECT/$NAME:$VERSION
  - name: Deploy
    run: gcloud run deploy $NAME --image gcr.io/$PROJECT/$NAME:$VERSION --region $REGION --memory $MEMORY
