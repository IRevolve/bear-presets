name: typescript
detection:
  files:
    - tsconfig.json
validation:
  setup:
    - name: Install
      run: npm ci
  lint:
    - name: Type check
      run: npx tsc --noEmit
    - name: Lint
      run: npm run lint --if-present
  test:
    - name: Test
      run: npm test --if-present
  build:
    - name: Build
      run: npm run build
